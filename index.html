<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<title>Garage 73</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

.screen {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
}

.screen.active {
    display: block;
}

.screen img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

#introVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

/* KITCHEN */
#kitchenButton {
    position: absolute;
    left: 13%;
    top: 39%;
    width: 37%;
    height: 13%;
    z-index: 10;
}

/* BAR */
#barButton {
    position: absolute;
    left: 51%;
    top: 39%;
    width: 37%;
    height: 13%;
    z-index: 10;
}

/* BACK */
.backButton {
    position: absolute;
    left: 2%;
    top: 1%;
    width: 30%;
    height: 9%;
    z-index: 10;
}
</style>
</head>

<body>

<div id="app">

    <!-- VIDEO -->
    <div id="videoScreen" class="screen active">

        <video
            id="introVideo"
            autoplay
            muted
            playsinline
            preload="auto">

            <source src="video.mp4" type="video/mp4">

        </video>

    </div>


    <!-- HOME -->
    <div id="homeScreen" class="screen">

        <img src="home.jpg" alt="Garage 73">

        <div
            id="kitchenButton"
            onclick="openKitchen()">
        </div>

        <div
            id="barButton"
            onclick="openBar()">
        </div>

    </div>


    <!-- KITCHEN -->
    <div id="kitchenScreen" class="screen">

        <img
            id="kitchenImage"
            src="kitchen-01.jpg"
            alt="Kitchen">

        <div
            class="backButton"
            onclick="goHome()">
        </div>

    </div>


    <!-- BAR -->
    <div id="barScreen" class="screen">

        <img
            id="barImage"
            src="bar-01.jpg"
            alt="Bar">

        <div
            class="backButton"
            onclick="goHome()">
        </div>

    </div>

</div>


<script>

const video = document.getElementById("introVideo");

let menuOpened = false;


/* Переход после видео */

function showHome() {

    if (menuOpened) return;

    menuOpened = true;

    video.pause();

    document
        .getElementById("videoScreen")
        .classList.remove("active");

    document
        .getElementById("homeScreen")
        .classList.add("active");
}


/* Основной способ */

video.addEventListener("ended", function() {
    showHome();
});


/* Запасной способ:
   когда видео практически закончилось */

video.addEventListener("timeupdate", function() {

    if (
        video.duration &&
        video.currentTime >= video.duration - 0.15
    ) {
        showHome();
    }

});


/* Если браузер сообщает duration */

video.addEventListener("loadedmetadata", function() {

    console.log("Video duration:", video.duration);

});


/* KITCHEN */

function openKitchen() {

    document
        .getElementById("homeScreen")
        .classList.remove("active");

    document
        .getElementById("barScreen")
        .classList.remove("active");

    document
        .getElementById("kitchenScreen")
        .classList.add("active");
}


/* BAR */

function openBar() {

    document
        .getElementById("homeScreen")
        .classList.remove("active");

    document
        .getElementById("kitchenScreen")
        .classList.remove("active");

    document
        .getElementById("barScreen")
        .classList.add("active");
}


/* BACK */

function goHome() {

    document
        .getElementById("kitchenScreen")
        .classList.remove("active");

    document
        .getElementById("barScreen")
        .classList.remove("active");

    document
        .getElementById("homeScreen")
        .classList.add("active");
}

</script>

</body>
</html>
